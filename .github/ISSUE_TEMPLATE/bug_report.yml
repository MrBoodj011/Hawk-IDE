name: Bug report
description: Report a reproducible Hawk IDE defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove API keys, tokens, private source code, and sensitive traffic before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps, a sample project when possible, and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hawk version, operating system, model provider, and Docker or Ollama versions when relevant.
    validations:
      required: true
